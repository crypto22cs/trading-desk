# 复制为 config/testnet.local.yaml 再改。该文件可提交，里面没有私钥。
# 真正广播还要在环境里设置 NADO_LIVE=1。只改这个文件不会发单。
mode: testnet
subaccountName: default
haltFile: .nado/HALT
stateFile: .nado/status.json

wallets:
  - id: test-1
    # 私钥放在 .env 的 NADO_PRIVATE_KEY，不要写在这里。
    keyEnv: NADO_PRIVATE_KEY
    # 可选：写上地址，程序会核对是否与私钥一致。
    # address: "0xabc..."

markets:
  BTC-PERP:
    productId: 2
    kind: perp
    priceTick: "1"
    sizeStep: "0.00005"
    minNotional: "100"
    enabled: true
  ETH-PERP:
    productId: 4
    kind: perp
    priceTick: "0.01"
    sizeStep: "0.001"
    minNotional: "100"
    enabled: true
  INK-USDT0:
    productId: 0
    kind: spot
    priceTick: "0.0001"
    sizeStep: "1"
    minNotional: "100"
    enabled: false

# 测试网默认可以更宽。这里故意收紧，方便第一次实盘。
caps:
  maxNotionalPerOrder: "300"
  maxNotionalPerHour: "1000"
  windowMs: 3600000
  maxWalletsConcurrent: 1
